<!DOCTYPE html>
<html>
<head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Geometric pattern background */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
      linear-gradient(135deg, rgba(255, 107, 53, 0.3) 0%, transparent 50%),
      linear-gradient(45deg, rgba(102, 126, 234, 0.3) 0%, transparent 50%),
      linear-gradient(225deg, rgba(0, 255, 136, 0.2) 0%, transparent 50%),
      linear-gradient(315deg, rgba(255, 0, 102, 0.2) 0%, transparent 50%);
    z-index: -2;
  }

  /* Geometric shapes */
  .shape {
    position: fixed;
    z-index: -1;
    opacity: 0.3;
    filter: blur(60px);
  }

  .shape1 {
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, #ff6b35, transparent);
    top: -100px;
    left: -100px;
    border-radius: 50%;
  }

  .shape2 {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, #667eea, transparent);
    bottom: -150px;
    right: -150px;
    border-radius: 50%;
  }

  .shape3 {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, #00ff88, transparent);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
  }

  .shape4 {
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, #ff0066, transparent);
    top: 20%;
    right: 20%;
    border-radius: 0;
    transform: rotate(45deg);
  }

  .container {
    background: rgba(15, 15, 25, 0.95);
    padding: 40px;
    border-radius: 25px;
    width: 600px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }

  .college-header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.2);
  }

  .college-name {
    color: #ff6b35;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
  }

  .dept-name {
    color: #667eea;
    font-size: 24px;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
  }

  .progress-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
  }

  .progress-step {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #0d1117;
    border: 2px solid #30363d;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-weight: bold;
    font-size: 20px;
    transition: all 0.3s;
  }

  .progress-step.active {
    background: #667eea;
    border-color: #667eea;
    color: white;
    box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
  }

  .progress-step.done {
    background: #00ff88;
    border-color: #00ff88;
    color: #0d1117;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  h2 {
    color: white;
    text-align: center;
    margin-bottom: 30px;
    font-size: 28px;
  }

  input, select {
    width: 100%;
    padding: 20px;
    margin: 12px 0;
    background: rgba(0, 0, 0, 0.5);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    color: white;
    font-size: 20px;
  }

  input:focus, select:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
  }

  input::placeholder {
    color: #888;
    font-size: 18px;
  }

  select option {
    background: #0d1117;
    color: white;
    font-size: 18px;
  }

  .btn-group {
    display: flex;
    gap: 15px;
    margin-top: 25px;
  }

  button {
    flex: 1;
    padding: 20px;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-next {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
  }

  .btn-next:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
  }

  .btn-back {
    background: rgba(255, 255, 255, 0.1);
    color: white;
  }

  .btn-back:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .btn-submit {
    background: linear-gradient(135deg, #00ff88, #00cc6a);
    color: #0a0a0a;
    font-size: 22px;
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
  }

  .radio-group {
    display: flex;
    gap: 20px;
    margin: 20px 0;
  }

  .radio-card {
    flex: 1;
    padding: 30px;
    background: rgba(0, 0, 0, 0.5);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 15px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
  }

  .radio-card:hover, .radio-card.selected {
    border-color: #667eea;
    background: rgba(102, 126, 234, 0.2);
    box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
  }

  .radio-card input {
    display: none;
  }

  .radio-card span {
    color: white;
    font-size: 24px;
  }

  .success-message {
    display: none;
    text-align: center;
    color: #00ff88;
    font-size: 26px;
    padding: 40px 0;
  }

  .success-message.show {
    display: block;
  }
</style>
</head>
<body>

<div class="shape shape1"></div>
<div class="shape shape2"></div>
<div class="shape shape3"></div>
<div class="shape shape4"></div>

<div class="container">
  <div class="college-header">
    <div class="college-name">JHARSUGUDA ENGINEERING SCHOOL</div>
    <div class="dept-name">IT DEPARTMENT</div>
  </div>

  <div class="progress-bar">
    <div class="progress-step active" id="step1">1</div>
    <div class="progress-step" id="step2">2</div>
    <div class="progress-step" id="step3">3</div>
    <div class="progress-step" id="step4">4</div>
    <div class="progress-step" id="step5">5</div>
  </div>

  <form id="multiForm" action="https://formspree.io/f/xnparqpq" method="POST">
    
    <!-- PAGE 1: Basic Info -->
    <div class="page active" id="page1">
      <h2>Student Details</h2>
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="tel" name="number" placeholder="Mobile Number" pattern="[0-9]{10}" required>
      <input type="text" name="regd" placeholder="Registration Number" required>
      <button type="button" class="btn-next" onclick="nextPage(2)">NEXT ➜</button>
    </div>

    <!-- PAGE 2: Gender -->
    <div class="page" id="page2">
      <h2>Choose Gender</h2>
      <div class="radio-group">
        <div class="radio-card" onclick="selectRadio(this)">
          <input type="radio" name="gender" value="Male" required>
          <span>👨 Male</span>
        </div>
        <div class="radio-card" onclick="selectRadio(this)">
          <input type="radio" name="gender" value="Female">
          <span>👩 Female</span>
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-back" onclick="prevPage(1)">⬅ BACK</button>
        <button type="button" class="btn-next" onclick="nextPage(3)">NEXT ➜</button>
      </div>
    </div>

    <!-- PAGE 3: Hostel -->
    <div class="page" id="page3">
      <h2>Living Type</h2>
      <div class="radio-group">
        <div class="radio-card" onclick="selectRadio(this)">
          <input type="radio" name="hostel" value="Hosteller" required>
          <span>🏠 Hosteller</span>
        </div>
        <div class="radio-card" onclick="selectRadio(this)">
          <input type="radio" name="hostel" value="Dayscholar">
          <span>🏡 Dayscholar</span>
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-back" onclick="prevPage(2)">⬅ BACK</button>
        <button type="button" class="btn-next" onclick="nextPage(4)">NEXT ➜</button>
      </div>
    </div>

    <!-- PAGE 4: Sports -->
    <div class="page" id="page4">
      <h2>Choose Sport</h2>
      <select name="sport" id="sportSelect" onchange="checkOther()" required>
        <option value="">Select Sport</option>
        <option>Cricket 🏏</option>
        <option>Football ⚽</option>
        <option>Volleyball 🏐</option>
        <option>Badminton 🏸</option>
        <option>Kho Kho 🏃</option>
        <option>Kabaddi 🤼</option>
        <option value="other">Other ➕</option>
      </select>
      <input type="text" name="otherSport" id="otherSportInput" placeholder="Type your sport" style="display:none;">
      <div class="btn-group">
        <button type="button" class="btn-back" onclick="prevPage(3)">⬅ BACK</button>
        <button type="button" class="btn-next" onclick="nextPage(5)">NEXT ➜</button>
      </div>
    </div>

    <!-- PAGE 5: Submit -->
    <div class="page" id="page5">
      <h2>Confirm & Submit</h2>
      <div style="color: #888; text-align: center; padding: 20px; font-size: 18px;">
        <p style="margin: 10px 0;">✅ All details filled correctly?</p>
        <p style="margin: 10px 0;">Click submit to complete registration</p>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-back" onclick="prevPage(4)">⬅ BACK</button>
        <button type="submit" class="btn-submit" id="submitBtn">🚀 SUBMIT</button>
      </div>
    </div>

  </form>

  <div class="success-message" id="successMsg">
    <p style="font-size: 40px; margin-bottom: 20px;">✅</p>
    <p>Registration Successful!</p>
  </div>
</div>

<script>
let currentPage = 1;
const totalPages = 5;

function nextPage(page) {
  if (page === 2) {
    const name = document.querySelector('input[name="name"]').value;
    const number = document.querySelector('input[name="number"]').value;
    const regd = document.querySelector('input[name="regd"]').value;
    
    if (!name || !number || !regd) {
      alert('Please fill all fields!');
      return;
    }
    if (number.length !== 10) {
      alert('Please enter valid 10-digit mobile number!');
      return;
    }
  }
  
  if (page === 3 && !document.querySelector('input[name="gender"]:checked')) {
    alert('Please select gender!');
    return;
  }
  
  if (page === 4 && !document.querySelector('input[name="hostel"]:checked')) {
    alert('Please select living type!');
    return;
  }
  
  if (page === 5) {
    const sport = document.getElementById('sportSelect').value;
    if (!sport) {
      alert('Please select sport!');
      return;
    }
  }
  
  document.getElementById('page' + currentPage).classList.remove('active');
  document.getElementById('page' + page).classList.add('active');
  
  document.getElementById('step' + currentPage).classList.remove('active');
  document.getElementById('step' + currentPage).classList.add('done');
  document.getElementById('step' + page).classList.add('active');
  
  currentPage = page;
}

function prevPage(page) {
  document.getElementById('page' + currentPage).classList.remove('active');
  document.getElementById('page' + page).classList.add('active');
  
  document.getElementById('step' + currentPage).classList.remove('active');
  document.getElementById('step' + page).classList.remove('done');
  document.getElementById('step' + page).classList.add('active');
  
  currentPage = page;
}

function selectRadio(element) {
  element.parentElement.querySelectorAll('.radio-card').forEach(card => {
    card.classList.remove('selected');
  });
  element.classList.add('selected');
  element.querySelector('input').checked = true;
}

function checkOther() {
  const select = document.getElementById('sportSelect');
  const otherInput = document.getElementById('otherSportInput');
  if (select.value === 'other') {
    otherInput.style.display = 'block';
    otherInput.required = true;
  } else {
    otherInput.style.display = 'none';
    otherInput.required = false;
  }
}
</script>

</body>
</html>
