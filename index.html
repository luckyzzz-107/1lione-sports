<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: Arial;
  }
  
  .box {
    background: white;
    padding: 30px;
    border-radius: 20px;
    width: 350px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  
  h2 {
    text-align: center;
    color: #333;
  }
  
  input, select {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
  }
  
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
  }
  
  button:hover {
    transform: scale(1.05);
  }
</style>
</head>
<body>

<div class="box">
  <h2>🏆 Sports Registration</h2>
  
  <form action="https://formspree.io/f/xnparqpq" method="POST">
    <input type="text" name="name" placeholder="👤 Full Name" required>
    
    <input type="tel" name="number" placeholder="📱 Phone Number" required>
    
    <select name="gender" required>
      <option value="">👥 Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
    
    <select name="hostel" required>
      <option value="">🏠 Hosteller/Dayscholar</option>
      <option>Hosteller</option>
      <option>Dayscholar</option>
    </select>
    
    <select name="sport" required>
      <option value="">🎯 Sports Choose Karo</option>
      <option>Cricket 🏏</option>
      <option>Football ⚽</option>
      <option>Basketball 🏀</option>
      <option>Volleyball 🏐</option>
      <option>Badminton 🏸</option>
      <option>Athletics 🏃</option>
    </select>
    
    <button type="submit">🚀 Register Karo!</button>
  </form>
</div>

</body>
</html>
