<!DOCTYPE html>
<html>
<head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background: #0d1117;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background-image: 
      radial-gradient(circle at 20% 50%, rgba(255, 107, 53, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 80% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%);
  }

  .container {
    background: #161b22;
    padding: 40px;
    border-radius: 20px;
    width: 500px;
    border: 1px solid #30363d;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .college-header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #30363d;
  }

  .college-name {
    color: #ff6b35;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 5px;
  }

  .dept-name {
    color: #667eea;
    font-size: 20px;
    letter-spacing: 3px;
  }

  .progress-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
  }

  .progress-step {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #0d1117;
    border: 2px solid #30363d;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-weight: bold;
    font-size: 16px;
    transition: all 0.3s;
  }

  .progress-step.active {
    background: #667eea;
    border-color: #667eea;
    color: white;
  }

  .progress-step.done {
    background: #00ff88;
    border-color: #00ff88;
    color: #0d1117;
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  h2 {
    color: white;
    text-align: center;
    margin-bottom: 25px;
    font-size: 22px;
  }

  input, select {
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 10px;
    color: white;
    font-size: 18px;
  }

  input:focus, select:focus {
    outline: none;
    border-color: #667eea;
  }

  input::placeholder {
    color: #666;
  }

  select option {
    background: #0d1117;
    color: white;
    font-size: 16px;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  button {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-next {
    background: #667eea;
    color: white;
  }

  .btn-next:hover {
    background: #5a6fd8;
  }

  .btn-back {
    background: #30363d;
    color: white;
  }

  .btn-back:hover {
    background: #3d444d;
  }

  .btn-submit {
    background: #00cc6a;
    color: white;
    font-size: 20px;
  }

  .btn-submit:hover {
    background: #00b85f;
  }

  .radio-group {
    display: flex;
    gap: 15px;
    margin: 15px 0;
  }

  .radio-card {
    flex: 1;
    padding: 25px;
    background: #0d1117;
    border: 2px solid #30363d;
    border-radius: 15px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
  }

  .radio-card:hover, .radio-card.selected {
    border-color: #667eea;
    background: #1a2233;
  }

  .radio-card input {
    display: none;
  }

  .radio-card span {
    color: white;
    font-size: 20px;
  }

  .success-message {
    display: none;
    text-align: center;
    color: #00ff88;
    font-size: 22px;
    padding: 40px 0;
  }

  .success-message.show {
    display: block;
  }
</style>
</head>
<body>

<div class="container">
  <div class="college-header">
    <div class="college-name">JHARSUGUDA ENGINEERING SCHOOL</div>
    <div class="dept-name">IT DEPARTMENT</div>
  </div>

  <div class="progress-bar">
    <div class="progress-step active" id="step1">1</div>
    <div class="progress-step" id="step2">2</div>
    <div class="progress-step" id="step3">3</div>
    <div class="progress-step" id="step4">4</div>
    <div class="progress-step" id="step5">5</div>
  </div>

  <form id="multiForm" action="https://formspree.io/f/xnparqpq" method="POST">
    
    <!-- PAGE 1: Basic Info -->
    <div class="page active" id="page1">
      <h2>Student Details</h2>
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="tel" name="number" placeholder="Mobile Number" pattern="[0-9]{10}" required>
      <input type="text" name="regd" placeholder="Registration Number" required>
      <input type="text" name="branch" placeholder="Branch (CSE, IT, ECE...)" required>
      <button type="button" class="btn-next" onclick="nextPage(2)">NEXT ➜</button>
    </div>

    <!-- PAGE 2: Gender -->
    <div class="page" id="page2">
      <h2>Choose Gender</h2>
      <div class="radio-group">
        <div class="radio-card" onclick="selectRadio(this)">
          <input type="radio" name="gender" value="Male" required>
          <span>👨 Male</span>
        </div>
        <div class="radio-card" onclick="selectRadio(this)">
          <input type="radio" name="gender" value="Female">
          <span>👩 Female</span>
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-back" onclick="prevPage(1)">⬅ BACK</button>
        <button type="button" class="btn-next" onclick="nextPage(3)">NEXT ➜</button>
      </div>
    </div>

    <!-- PAGE 3: Hostel -->
    <div class="page" id="page3">
      <h2>Living Type</h2>
      <div class="radio-group">
        <div class="radio-card" onclick="selectRadio(this)">
          <input type="radio" name="hostel" value="Hosteller" required>
          <span>🏠 Hosteller</span>
        </div>
        <div class="radio-card" onclick="selectRadio(this)">
          <input type="radio" name="hostel" value="Dayscholar">
          <span>🏡 Dayscholar</span>
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-back" onclick="prevPage(2)">⬅ BACK</button>
        <button type="button" class="btn-next" onclick="nextPage(4)">NEXT ➜</button>
      </div>
    </div>

    <!-- PAGE 4: Sports -->
    <div class="page" id="page4">
      <h2>Choose Sport</h2>
      <select name="sport" id="sportSelect" onchange="checkOther()" required>
        <option value="">Select Sport</option>
        <option>Cricket 🏏</option>
        <option>Football ⚽</option>
        <option>Volleyball 🏐</option>
        <option>Badminton 🏸</option>
        <option>Kho Kho 🏃</option>
        <option>Kabaddi 🤼</option>
        <option value="other">Other ➕</option>
      </select>
      <input type="text" name="otherSport" id="otherSportInput" placeholder="Type your sport" style="display:none;">
      <div class="btn-group">
        <button type="button" class="btn-back" onclick="prevPage(3)">⬅ BACK</button>
        <button type="button" class="btn-next" onclick="nextPage(5)">NEXT ➜</button>
      </div>
    </div>

    <!-- PAGE 5: Submit -->
    <div class="page" id="page5">
      <h2>Confirm & Submit</h2>
      <div style="color: #888; text-align: center; padding: 20px; font-size: 18px;">
        <p style="margin: 10px 0;">✅ All details filled correctly?</p>
        <p style="margin: 10px 0;">Click submit to complete registration</p>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-back" onclick="prevPage(4)">⬅ BACK</button>
        <button type="submit" class="btn-submit" id="submitBtn">🚀 SUBMIT</button>
      </div>
    </div>

  </form>

  <div class="success-message" id="successMsg">
    <p style="font-size: 40px; margin-bottom: 20px;">✅</p>
    <p>Registration Successful!</p>
  </div>
</div>

<script>
let currentPage = 1;
const totalPages = 5;

function nextPage(page) {
  if (page === 2) {
    const name = document.querySelector('input[name="name"]').value;
    const number = document.querySelector('input[name="number"]').value;
    const regd = document.querySelector('input[name="regd"]').value;
    const branch = document.querySelector('input[name="branch"]').value;
    
    if (!name || !number || !regd || !branch) {
      alert('Please fill all fields!');
      return;
    }
    if (number.length !== 10) {
      alert('Please enter valid 10-digit mobile number!');
      return;
    }
  }
  
  if (page === 3 && !document.querySelector('input[name="gender"]:checked')) {
    alert('Please select gender!');
    return;
  }
  
  if (page === 4 && !document.querySelector('input[name="hostel"]:checked')) {
    alert('Please select living type!');
    return;
  }
  
  if (page === 5) {
    const sport = document.getElementById('sportSelect').value;
    if (!sport) {
      alert('Please select sport!');
      return;
    }
  }
  
  document.getElementById('page' + currentPage).classList.remove('active');
  document.getElementById('page' + page).classList.add('active');
  
  document.getElementById('step' + currentPage).classList.remove('active');
  document.getElementById('step' + currentPage).classList.add('done');
  document.getElementById('step' + page).classList.add('active');
  
  currentPage = page;
}

function prevPage(page) {
  document.getElementById('page' + currentPage).classList.remove('active');
  document.getElementById('page' + page).classList.add('active');
  
  document.getElementById('step' + currentPage).classList.remove('active');
  document.getElementById('step' + page).classList.remove('done');
  document.getElementById('step' + page).classList.add('active');
  
  currentPage = page;
}

function selectRadio(element) {
  element.parentElement.querySelectorAll('.radio-card').forEach(card => {
    card.classList.remove('selected');
  });
  element.classList.add('selected');
  element.querySelector('input').checked = true;
}

function checkOther() {
  const select = document.getElementById('sportSelect');
  const otherInput = document.getElementById('otherSportInput');
  if (select.value === 'other') {
    otherInput.style.display = 'block';
    otherInput.required = true;
  } else {
    otherInput.style.display = 'none';
    otherInput.required = false;
  }
}

// SIMPLE SUBMIT - DIRECT SUBMIT TO FORMSPREE
document.getElementById('multiForm').addEventListener('submit', function(e) {
  // Form will submit directly to Formspree
  // No preventDefault - direct submission
});
</script>

</body>
</html>
